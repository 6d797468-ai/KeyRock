[mypy]
python_version = 3.10
strict = True
warn_return_any = True
disallow_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = False
files = keyrock_core, keyrock_api, keyrock_cli, keyrock_shell

[mypy-pyperclip.*]
ignore_missing_imports = True

[mypy-structlog.*]
ignore_missing_imports = True
