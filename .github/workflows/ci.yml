name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ruff check
        run: ruff check keyrock_core/ keyrock_cli/ keyrock_api/ keyrock_shell/ tests/
      - name: ruff format --check
        run: ruff format --check keyrock_core/ keyrock_cli/ keyrock_api/ keyrock_shell/ tests/
      - name: mypy
        run: mypy keyrock_core/ keyrock_cli/ keyrock_api/ keyrock_shell/
      - name: pytest
        run: python -m pytest tests/ -v
      - name: Vérifier l'absence de secrets commités
        run: git ls-files | grep -E '^\.env$' && exit 1 || exit 0

  build:
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t keyrock:ci .
